<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
</head>
<body>
	
	<div id="content">
		<div class="flex justify-center items-center min-h-screen mt-2">

			<div class="  block p-6 border-t-[10px] border-green-700 bg-white rounded-xl shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-blue-700 dark:hover:bg-gray-700">

				 	<!----message here-->
					<div data-th-replace="\message::messagebox"></div>

				<h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
					Login Here
				</h5>

				<p class="font-normal text-gray-400 dark:text-gray-400">
					Start managing contacts on cloud...
				</p>

				<div class="text-red-600 text-center" th:if="${param.error}">Invalid username and password.</div>
				<div class="text-green-600 text-center" th:if="${param.logout}">You have been logged out.</div>

				<form 
					method="post"
					data-th-action="@{'/authenticate'}"
				 	class="mt-5">
					
					<div class="mb-3">
						<label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
						<input 
							name="email"
							type="email" id="email"
							class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
							placeholder="Enter email" required />
							
					</div>
					<div class="mb-3">
						<label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">New Passwrod</label>
						<input 
							name="password"
							type="password" id="password"
							class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" />
					</div>
						
						<div class="mb-3 flex justify-center space-x-3">
							<button
							type="submit"
								class="px-3 py-2 rounded bg-gray-800 hover:bg-gray text-white dark:bg-blue-700 dark:hover:bg-blue-800 hover:bg-gray-900">
								Login
							</button>
							<button class="px-3 py-2 rounded bg-orange-500 hover:bg-gray text-white dark:bg-blue-700 dark:hover:bg-blue-800 hover:bg-gray-900">
								Reset
							</button>
						</div>
				</form>

			</div>

		</div>

			
	</div>
	<script>
		console.log("Login page");
	</script>
</body>
</html>
